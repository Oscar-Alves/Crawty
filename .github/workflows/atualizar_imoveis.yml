name: Atualização Automática de Imóveis (Crawlers + MongoDB)

on:
  # Executa automaticamente às segundas e quintas-feiras às 06:00 (horário de Brasília / 09:00 UTC)
  schedule:
    - cron: '0 9 * * 1,4'
  # Permite disparar manualmente pela aba "Actions" do GitHub a qualquer momento
  workflow_dispatch:

jobs:
  capturar-e-atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install --only-binary :all: -r requirements.txt

      - name: Executar Crawlers das Imobiliárias
        run: python main.py

      - name: Enviar e Normalizar Dados no MongoDB
        env:
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
          DB_NAME: ${{ secrets.DB_NAME || 'imobiliaria_db' }}
        run: python loader_mongo.py --todos

